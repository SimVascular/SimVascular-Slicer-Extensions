# `svremesh` is installed into Slicer by this module's CMakeLists, and pip-installed only for
# use outside Slicer -- a headless test run, or another project importing the remesher. Neither
# path needs the other: under Slicer the module's own directory is already on `sys.path`.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svremesh"
version = "0.1.0"
description = "Remesh a ModelFaceID-labelled surface to a uniform edge length without losing its labels"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{ name = "Aaron Brown" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Pinned to nothing: Slicer ships both, and pinning here would fight whatever the host has.
dependencies = ["numpy", "vtk"]

[project.urls]
Homepage = "https://github.com/SimVascular/SlicerSimVascular"

[tool.setuptools.packages.find]
# The scripted module beside it is not a package, and the tests do not ship.
include = ["svremesh*"]
